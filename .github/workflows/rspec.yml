name: RSpec
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

concurrency:
  group: rspec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rspec_shard:
    name: RSpec shard ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.10.3
        ports:
          - 9200:9200
          - 9300:9300
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        options: >-
            --health-cmd "curl -f -X GET localhost:9200/_cluster/health?wait_for_status=green&timeout=1s || exit 1"
            --health-interval 5s
            --health-timeout 2s
            --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.6.1"
          cache: yarn

      - name: Set up Ruby
        uses: ruby/setup-ruby@1287d2b408066abada82d5ad1c63652e758428d9
        with:
          bundler-cache: true

      - name: Install js dependencies
        run: yarn install --frozen-lockfile

      - name: Cache test assets
        id: assets
        uses: actions/cache@v4
        with:
          path: |
            public/assets
            app/assets/builds
          key: test-assets-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'yarn.lock', 'package.json', 'app/**', 'config/**', 'vendor/javascript/**') }}

      - name: Run tests
        env:
          RAILS_ENV: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB_TEST: app_test
          PGHOST: localhost
          CI: true
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          bundle exec rails db:schema:load
          bundle exec rails after_party:generate_synonym_set
          if [ '${{ steps.assets.outputs.cache-hit }}' != 'true' ]; then
            bundle exec rake assets:precompile
          fi
          ruby bin/rspec-shard ${{ matrix.shard }} 2 --profile 20 --format progress --format json --out tmp/rspec-results.json

      - name: Report test timing
        if: ${{ always() }}
        run: |
          if [ -f tmp/rspec-results.json ]; then
            ruby -rjson -e 's = JSON.parse(File.read("tmp/rspec-results.json")).fetch("summary"); puts "Shard ${{ matrix.shard }}: #{s.fetch("example_count")} examples, #{s.fetch("failure_count")} failures, #{s.fetch("duration").round(2)} seconds"' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Archive test timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rspec-timings-${{ matrix.shard }}
          path: tmp/rspec-results.json

      - name: Archive selenium screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots-${{ matrix.shard }}
          path: ${{ github.workspace }}/tmp/capybara/*.png
          overwrite: true

  # Keep the original required check name while testing on separate runners.
  rspec:
    runs-on: ubuntu-latest
    needs: rspec_shard
    if: ${{ always() }}
    steps:
      - run: test '${{ needs.rspec_shard.result }}' = success
