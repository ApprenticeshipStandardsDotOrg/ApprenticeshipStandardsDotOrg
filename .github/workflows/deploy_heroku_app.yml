name: Deploy Heroku app
permissions:
  contents: read
  packages: read

on:
  workflow_call:
    inputs:
      heroku_app:
        required: true
        type: string
      environment:
        required: true
        type: string
      environment_label:
        required: true
        type: string
      web_image:
        required: true
        type: string
      worker_image:
        required: true
        type: string
      release_image:
        required: true
        type: string
    secrets:
      HEROKU_API_KEY:
        required: true
      SLACK_DEPLOY_HOOK_URL:
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.environment_label }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@1287d2b408066abada82d5ad1c63652e758428d9

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested process images to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ inputs.heroku_app }}
          WEB_SOURCE_IMAGE: ${{ inputs.web_image }}
          WORKER_SOURCE_IMAGE: ${{ inputs.worker_image }}
          RELEASE_SOURCE_IMAGE: ${{ inputs.release_image }}
        run: |
          printf '%s' "$HEROKU_API_KEY" | docker login --username _ --password-stdin registry.heroku.com
          for process in web worker release; do
            source_var="${process^^}_SOURCE_IMAGE"
            source_image="${!source_var}"
            destination="registry.heroku.com/${HEROKU_APP}/${process}"
            docker pull "$source_image"
            docker tag "$source_image" "$destination"
            docker push "$destination"
            image_id=$(docker inspect "$source_image" --format '{{.Id}}')
            printf '%s_IMAGE_ID=%s\n' "${process^^}" "$image_id" >> "$GITHUB_ENV"
          done

      - name: Deploy to Heroku ${{ inputs.environment_label }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ inputs.heroku_app }}
        run: |
          ruby bin/release-heroku-container

      - name: Notify Slack of ${{ inputs.environment_label }} deploy
        if: ${{ always() }}
        uses: slackapi/slack-github-action@v3.0.5
        with:
          webhook: ${{ secrets.SLACK_DEPLOY_HOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Apprenticeship Standards - ${{ inputs.environment_label }} deploy ${{ job.status }}: ${{ github.sha }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*${{ inputs.environment_label }} deploy ${{ job.status }}*"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: |-
                      *Repository:*
                      ${{ github.repository }}
                  - type: "mrkdwn"
                    text: |-
                      *Commit:*
                      `${{ github.sha }}`
                  - type: "mrkdwn"
                    text: |-
                      *Triggered by:*
                      ${{ github.actor }}
                  - type: "mrkdwn"
                    text: |-
                      *Environment:*
                      ${{ inputs.environment }}
              - type: "actions"
                elements:
                  - type: "button"
                    text:
                      type: "plain_text"
                      text: "View workflow run"
                    url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
