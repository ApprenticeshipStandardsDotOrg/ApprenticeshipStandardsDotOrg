name: Deploy
permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build_images:
    name: Build cached process images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.names.outputs.prefix }}@${{ steps.web.outputs.digest }}
      worker_image: ${{ steps.names.outputs.prefix }}@${{ steps.worker.outputs.digest }}
      release_image: ${{ steps.names.outputs.prefix }}@${{ steps.release.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.prefix }}:${{ github.sha }}-web
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=deployment
          cache-to: type=gha,scope=deployment,mode=max
      - name: Publish worker command using the same cached application
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.prefix }}:${{ github.sha }}-worker
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=deployment
      - name: Publish release command using the same cached application
        id: release
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.prefix }}:${{ github.sha }}-release
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=deployment

  deploy_staging:
    name: Deploy staging
    needs: build_images
    uses: ./.github/workflows/deploy_heroku_app.yml
    with:
      heroku_app: apprenticeship-standards-stag
      environment: staging
      environment_label: Staging
      web_image: ${{ needs.build_images.outputs.web_image }}
      worker_image: ${{ needs.build_images.outputs.worker_image }}
      release_image: ${{ needs.build_images.outputs.release_image }}
    secrets: inherit

  deploy_production:
    name: Deploy production
    needs: [build_images, deploy_staging]
    uses: ./.github/workflows/deploy_heroku_app.yml
    with:
      heroku_app: apprenticeship-standards-dot-o
      environment: production
      environment_label: Production
      web_image: ${{ needs.build_images.outputs.web_image }}
      worker_image: ${{ needs.build_images.outputs.worker_image }}
      release_image: ${{ needs.build_images.outputs.release_image }}
    secrets: inherit
