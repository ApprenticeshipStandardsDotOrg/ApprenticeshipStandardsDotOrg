build:
  docker:
    web:
      dockerfile: Dockerfile
      target: final
  config:
    RAILS_ENV: production
release:
  command:
    - bundle exec rails db:migrate && rake after_party:run
  image: web
run:
  web: bundle exec puma -C config/puma.rb
  worker: 
    command:
      - bundle exec sidekiq -c 3 -q default
    image: web
  aiworker:
    command:
      - ruby bin/ai-worker
    image: web
